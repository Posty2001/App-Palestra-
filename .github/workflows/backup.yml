# Backup giornaliero cifrato di APP PALESTRA (database Neon, foto incluse) — gratuito su GitHub Actions.
# Segreti del repository richiesti: BACKUP_DATABASE_URL (stringa Neon), BACKUP_AGE_RECIPIENT (chiave PUBBLICA age).
# Il file risultante è cifrato: senza la chiave privata (tenuta offline) è illeggibile, anche per chi scarica l'artefatto.
name: backup
on:
  schedule:
    - cron: '17 2 * * *'   # ogni giorno alle 02:17 UTC
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti (pg_dump 16, age)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 age
      - name: Backup cifrato
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          STORAGE_DRIVER: db
          BACKUP_DIR: out
          BACKUP_ENV: test
          APP_VERSION: ${{ github.sha }}
        run: PATH=/usr/lib/postgresql/16/bin:$PATH ./deploy/backup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: palestra-backup-${{ github.run_id }}
          path: out/*.tar.age
          retention-days: 7          # 500 MB inclusi per i repository privati: ridurre se il database cresce
          if-no-files-found: error
