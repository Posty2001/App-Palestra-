# Render Blueprint — APP PALESTRA, ambiente TEST a costo 0 € (piano Free).
# Architettura gratuita: web service Render Free (senza disco) + PostgreSQL Neon Free (foto nel database).
# Il Free di Render si sospende dopo 15 minuti senza traffico (risveglio ~1 minuto) e non ha disco né shell.
# Nessun segreto qui: i valori "sync: false" si inseriscono a mano nel pannello Render.
services:
  - type: web
    name: app-palestra-test
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: claude/peaceful-archimedes-lzmfeq
    region: frankfurt
    plan: free
    autoDeploy: false
    # Nessun healthCheckPath: /api/health interroga il database e terrebbe sveglio Neon consumando le ore di calcolo gratuite.
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: STORAGE_DRIVER      # foto in PostgreSQL: il filesystem del piano Free è effimero
        value: db
      - key: DATABASE_URL        # stringa di connessione Neon (regione Frankfurt), con ?sslmode=require
        sync: false
      - key: APP_URL             # es. https://app-palestra-test.onrender.com
        sync: false
      - key: SESSION_DAYS
        value: "30"
      - key: INVITE_DAYS
        value: "7"
      - key: BACKUP_SCHEDULE_ENABLED   # i backup girano su GitHub Actions (.github/workflows/backup.yml)
        value: "false"
